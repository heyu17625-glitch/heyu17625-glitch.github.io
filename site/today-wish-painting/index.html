  <main id="content"><section class="split"><div><p class="eyebrow">核心栏目</p><h1>今日如愿画</h1><p class="lead">把愿望写成一幅画，而不是承诺一个结果。</p><p>观者写下对家人、工作、远行、成长或团圆的心愿，创作者再从山、水、松、竹、双鹤等传统意象中寻找对应的画面。</p><p>这里的“如愿”不是预测，也不是功效。它是一种参与式创作：让普通人的真实愿望成为作品的起点，让创作不只讲艺术家自己，也回应看画之人的生活。</p><p class="closing">愿见者如愿。</p></div><figure><img src="../assets/gallery/08.png" alt="把愿望写成一幅画，而不是承诺一个结果"></figure></section></main>
  <footer><strong>李三明·道意山水</strong><span>山是稳，水是流，留白是呼吸。</span><span>愿见者如愿。</span></footer>
