name: Li Sanming site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:site
      - uses: actions/upload-artifact@v4
        with:
          name: verified-geo-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
